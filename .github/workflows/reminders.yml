name: Meal reminders

# 15분마다 실행해요. 알림은 끼니마다 하루 한 번만 가요 (scripts/send-reminder.js 참고).
# GitHub 예약 실행은 몇 시간씩 늦어질 때가 있어서, 하루 세 번만 예약하면 알림도 그만큼 늦어요.
# 자주 실행해 두면 끼니 시간(08:00 / 11:30 / 19:00 KST) 바로 뒤에 도착한 실행이 알림을 보내요.
# 붐비는 정각·15분·30분·45분은 피했어요.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}     # 수동 테스트용 (지금 시각과 가까운 끼니 알림을 바로 보냄)

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install firebase-admin
      - run: node scripts/send-reminder.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # 예약 실행인지 구분 (수동 실행이면 비어 있음)
          SCHEDULE: ${{ github.event.schedule }}
